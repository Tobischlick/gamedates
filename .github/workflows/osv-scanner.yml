name: OSV-Scanner Scheduled Scan

on:
  schedule:
    - cron: '30 4 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-26.04
      scan-args: |-
        -r
        ./
