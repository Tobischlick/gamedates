name: Daily Calendar Sync

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Restore Google credentials
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" > src/main/resources/credentials.json

      - name: Restore OAuth token store
        run: |
          mkdir -p tokens
          echo "${{ secrets.GOOGLE_TOKEN_STORED_CREDENTIAL_B64 }}" | base64 -d > tokens/StoredCredential

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Run sync
        env:
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          HOME_TEAM: ${{ secrets.HOME_TEAM }}
          POSTING_ENABLED: "true"
        run: java -jar target/gamedates-1.0.0.jar
