name: Calendar Sync

on:
  workflow_call:
    inputs:
      posting-enabled:
        description: 'Write changes to the calendar (false = dry run)'
        type: boolean
        default: true
    secrets:
      GOOGLE_CREDENTIALS_JSON:
        required: true
      GOOGLE_TOKEN_STORED_CREDENTIAL_B64:
        required: true
      CALENDAR_ID:
        required: true
      HOME_TEAM:
        required: true
      CLUB_ID:
        required: true

jobs:
  sync:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDENTIALS_JSON" > src/main/resources/credentials.json

      - name: Restore OAuth token store
        env:
          GOOGLE_TOKEN_STORED_CREDENTIAL_B64: ${{ secrets.GOOGLE_TOKEN_STORED_CREDENTIAL_B64 }}
        run: |
          mkdir -p tokens
          echo "$GOOGLE_TOKEN_STORED_CREDENTIAL_B64" | base64 -d > tokens/StoredCredential

      - name: Build
        run: ./gradlew clean shadowJar -x test

      - name: Run sync
        env:
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          HOME_TEAM: ${{ secrets.HOME_TEAM }}
          CLUB_ID: ${{ secrets.CLUB_ID }}
          POSTING_ENABLED: ${{ inputs.posting-enabled }}
        run: java -jar build/libs/gamedates-1.0.0-all.jar
